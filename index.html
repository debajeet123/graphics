<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edomites Animated Timeline + Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --accent: #f59e0b;
      --text: #f9fafb;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 45%);
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem;
      display: grid;
      gap: 1rem;
    }
    .hero, .panel {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 18px;
      backdrop-filter: blur(6px);
    }
    .hero { padding: 1.2rem 1.2rem 1rem; }
    .hero h1 { margin: 0 0 .5rem; font-size: clamp(1.2rem, 2.4vw, 2rem); }
    .hero p { margin: 0; color: var(--muted); line-height: 1.6; }
    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: 1.2fr 1fr;
    }
    .panel { padding: 1rem; }
    #map { width: 100%; height: 420px; border-radius: 14px; }
    .timeline {
      display: grid;
      gap: .7rem;
      max-height: 420px;
      overflow: auto;
      padding-right: .25rem;
    }
    .event {
      border: 1px solid transparent;
      border-radius: 12px;
      padding: .7rem;
      background: linear-gradient(160deg, #111827, #0b1220);
      transition: transform .25s ease, border-color .25s ease, background .25s ease;
      cursor: pointer;
    }
    .event.active {
      border-color: rgba(245, 158, 11, .8);
      background: linear-gradient(160deg, #2a1e08, #17100a);
      transform: translateX(4px);
    }
    .event small { color: var(--accent); }
    .event h3 { margin: .2rem 0 .35rem; font-size: 1rem; }
    .event p { margin: 0; color: var(--muted); font-size: .92rem; line-height: 1.35; }
    .progress-wrap { height: 8px; background: #374151; border-radius: 10px; overflow: hidden; }
    #progress { height: 100%; width: 0; background: linear-gradient(90deg, #f59e0b, #fb7185); transition: width 5s linear; }
    .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .85rem; }
    .chip { background: var(--panel-2); padding: .35rem .6rem; border-radius: 999px; font-size: .82rem; color: #d1d5db; }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      #map, .timeline { max-height: 360px; height: 360px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <h1 id="title"></h1>
      <p id="summary"></p>
      <div class="chips" id="features"></div>
    </section>

    <section class="grid">
      <article class="panel">
        <h2 style="margin-top:.2rem;">Animated Historical Timeline</h2>
        <div class="progress-wrap"><div id="progress"></div></div>
        <div class="timeline" id="timeline"></div>
      </article>

      <article class="panel">
        <h2 style="margin-top:.2rem;">Edom Region Map</h2>
        <div id="map"></div>
      </article>
    </section>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module">
    import edomitesInfo from './edomites_info.js';

    const title = document.getElementById('title');
    const summary = document.getElementById('summary');
    const features = document.getElementById('features');
    const timelineEl = document.getElementById('timeline');
    const progressEl = document.getElementById('progress');

    title.textContent = edomitesInfo.title;
    summary.textContent = edomitesInfo.summary;

    [...edomitesInfo.location.modernEquivalent, ...edomitesInfo.culturalNotes.economy]
      .slice(0, 6)
      .forEach((item) => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = item;
        features.appendChild(chip);
      });

    const map = L.map('map', { zoomControl: false });
    const { mapCenter } = edomitesInfo.location;
    map.setView([mapCenter.lat, mapCenter.lng], mapCenter.zoom);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 12,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const markers = edomitesInfo.location.importantSites.map((site) => {
      const marker = L.circleMarker([site.coordinates.lat, site.coordinates.lng], {
        radius: 7,
        color: '#f59e0b',
        fillColor: '#fb7185',
        fillOpacity: 0.85,
        weight: 2
      }).addTo(map).bindPopup(`<b>${site.name}</b><br>${site.significance}`);

      return marker;
    });

    edomitesInfo.location.tradeRoutes.forEach((route) => {
      L.polyline(route.path.map((p) => [p.lat, p.lng]), {
        color: '#f59e0b',
        weight: 3,
        opacity: 0.8,
        dashArray: '8, 8'
      }).addTo(map).bindPopup(route.name);
    });

    const events = edomitesInfo.timeline.map((entry, idx) => {
      const card = document.createElement('article');
      card.className = 'event';
      card.innerHTML = `
        <small>${entry.date}</small>
        <h3>${entry.period}</h3>
        <p>${entry.description}</p>
      `;
      card.addEventListener('click', () => activate(idx, false));
      timelineEl.appendChild(card);
      return card;
    });

    let current = -1;
    let ticker;

    function updateProgress() {
      progressEl.style.transition = 'none';
      progressEl.style.width = '0';
      void progressEl.offsetWidth;
      progressEl.style.transition = 'width 5s linear';
      progressEl.style.width = '100%';
    }

    function activate(index, autoAdvance = true) {
      current = index;
      events.forEach((e, i) => e.classList.toggle('active', i === index));
      events[index].scrollIntoView({ block: 'nearest', behavior: 'smooth' });

      const focus = edomitesInfo.timeline[index].mapFocus;
      map.flyTo([focus.lat, focus.lng], focus.zoom, { duration: 1.4 });

      markers.forEach((marker, i) => {
        marker.setStyle({ radius: i === index % markers.length ? 11 : 7, fillOpacity: i === index % markers.length ? 1 : 0.7 });
      });

      if (autoAdvance) {
        clearTimeout(ticker);
        updateProgress();
        ticker = setTimeout(() => activate((index + 1) % events.length), 5000);
      }
    }

    activate(0);
  </script>
</body>
</html>
